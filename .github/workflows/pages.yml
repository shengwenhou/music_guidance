name: Deploy listening guide

on:
  push:
    branches: [main]
    paths: ["dist/**", "tests/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript
        run: |
          node --check dist/guide-data.js
          node --check dist/app.js
          node --check dist/lyrics-data.js
          node --check dist/mahler8/guide-data.js
          node --check dist/mahler8/app.js
          node --check dist/mahler8/lyrics-data.js
      - name: Test guide interactions
        run: node --test tests/*.test.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
